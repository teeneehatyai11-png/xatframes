<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
    }

    /* 🖼️ ฝั่งซ้าย */
    .left-card {
      position: absolute;
      top: 100px;
      left: 10px;
      width: 290px;
      height: 460px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      overflow: hidden;
      z-index: 100;
    }

    /* 📱 ฝั่งขวา (วิทยุ) */
    .right-card {
      position: absolute;
      top: 100px;
      right: 10px;
      width: 290px;
      height: 460px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      overflow: hidden;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    /* วิดีโอพื้นหลัง */
    .video-bg-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .video-bg-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay ครอบส่วนควบคุม */
    .card-content-overlay {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(10, 15, 30, 0.95) 0%, rgba(10, 15, 30, 0.3) 50%, rgba(10, 15, 30, 0.85) 100%);
      padding: 14px;
    }

    .radio-header {
      font-size: 14px;
      font-weight: 700;
      color: #ff0050;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff0050;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0050;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* เครื่องเล่น */
    .glass-player {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-info {
      text-align: center;
    }

    .now-playing {
      font-size: 10px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 1px;
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-select {
      width: 100%;
      background: #0d1117;
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 6px;
      padding: 6px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    /* ปุ่มกดเล่นเพลง */
    .play-btn-large {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #d91c5c 0%, #00c6ff 100%);
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(217, 28, 92, 0.5);
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a0aec0;
      font-size: 11px;
    }

    .volume-box input[type="range"] {
      flex: 1;
      accent-color: #00f2fe;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="audio-player" preload="none" crossorigin="anonymous"></audio>

  <!-- ฝั่งซ้าย (วิดีโอ yc18zg.mp4)[cite: 1] -->
  <div class="left-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- ฝั่งขวา (วิดีโอ s9d6v6.mp4)[cite: 1] -->
  <div class="right-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card-content-overlay">
      <div class="radio-header">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>

      <div class="glass-player">
        <div class="song-info">
          <div class="now-playing">NOW PLAYING</div>
          <div class="track-title" id="current-title">รวมเพลงเพราะฟังสบาย</div>
        </div>

        <select class="playlist-select" id="station-select">
          <option value="0">1. รวมเพลงเพราะฟังสบาย</option>
          <option value="1">2. รวมเพลงเพราะฟังสบายตอนทำงาน</option>
          <option value="2">3. รวมเพลงเพราะฟังสบาย (สถานีที่ 3)</option>
          <option value="3">4. รวมเพลงเพราะวันพักผ่อน</option>
        </select>

        <div class="volume-box">
          <i class="fas fa-volume-up"></i>
          <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
        </div>

        <button class="play-btn-large" id="main-play-btn">
          <i class="fas fa-play" id="btn-icon"></i>
          <span id="btn-text">กดเพื่อฟังวิทยุสด</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const playlist = [
      { name: "รวมเพลงเพราะฟังสบาย", url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3" },
      { name: "รวมเพลงเพราะฟังสบายตอนทำงาน", url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3" },
      { name: "รวมเพลงเพราะฟังสบาย (สถานีที่ 3)", url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3" },
      { name: "รวมเพลงเพราะวันพักผ่อน", url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const mainPlayBtn = document.getElementById('main-play-btn');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const title = document.getElementById('current-title');
    const stationSelect = document.getElementById('station-select');
    const volumeRange = document.getElementById('volume-range');

    let currentIndex = 0;
    let isPlaying = false;

    // ฟังก์ชันสั่งเล่นเสียงแบบรองรับ User Gesture
    function togglePlay() {
      if (!audio.src || audio.src === "") {
        audio.src = playlist[currentIndex].url;
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        btnIcon.className = 'fas fa-play';
        btnText.textContent = 'กดเพื่อฟังวิทยุสด';
      } else {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            isPlaying = true;
            btnIcon.className = 'fas fa-pause';
            btnText.textContent = 'หยุดฟังวิทยุ';
          }).catch(error => {
            console.log("Autoplay blocked/failed: ", error);
            alert("กรุณาคลิกบนหน้าจอหรือปุ่มเล่นอีกครั้ง เพื่อเปิดระบบเสียง");
          });
        }
      }
    }

    // ผูก Event Direct
    mainPlayBtn.addEventListener('click', togglePlay);

    stationSelect.addEventListener('change', function() {
      currentIndex = parseInt(this.value);
      title.textContent = playlist[currentIndex].name;
      audio.src = playlist[currentIndex].url;
      audio.load();
      if (isPlaying) {
        audio.play();
      }
    });

    volumeRange.addEventListener('input', function() {
      audio.volume = parseFloat(this.value);
    });
  </script>

</body>
</html>
