<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Stream</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: transparent;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* วิดีโอพื้นหลังใหม่ ดันภาพไปทางขวา */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: 85% center;
            z-index: -999;
        }

        /* กล่องวิทยุฝั่งซ้ายที่สามารถลากเลื่อนได้ และอยู่กึ่งกลางแนวตั้งตอนเริ่ม */
        .draggable-sidebar {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            width: 270px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 2147483647;
            overflow: hidden;
            cursor: move; /* เปลี่ยนรูปเมาส์ให้รู้ว่าลากได้ */
            user-select: none;
        }

        /* ส่วนหัวสำหรับใช้คลิกลากเลื่อน */
        .drag-header {
            background: rgba(30, 41, 59, 0.9);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .drag-hint {
            font-size: 8px;
            color: #94a3b8;
            background: rgba(56, 189, 248, 0.1);
            padding: 1px 5px;
            border-radius: 3px;
        }

        /* กรอบ iframe วิทยุ */
        .radio-frame-container {
            padding: 10px;
            background: transparent;
        }

        .radio-frame-container iframe {
            width: 100%;
            height: 140px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- วิดีโอพื้นหลัง -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://files.catbox.moe/ebhsth.mp4" type="video/mp4">
    </video>

    <!-- กล่องวิทยุฝั่งซ้ายแบบลากเลื่อนได้ อยู่กึ่งกลางแนวตั้ง -->
    <div class="draggable-sidebar" id="draggable-box">
        <div class="drag-header" id="drag-handle">
            <span>MYRADIOhit Live</span>
            <span class="drag-hint">↔ กดลากย้ายได้</span>
        </div>
        <div class="radio-frame-container">
            <iframe src="https://radio.plathong.net/main/player/?server=radio9&port=7264" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ระบบควบคุมการลากเลื่อนกล่องวิทยุ (Draggable)
        const box = document.getElementById('draggable-box');
        const handle = document.getElementById('drag-handle');

        let isDragging = false;
        let startX, startY, initialX, initialY;

        handle.addEventListener('mousedown', (e) => {
            isDragging = true;
            // เมื่อเริ่มลาก ให้ยกเลิก transform แนวตั้ง เพื่อให้คำนวณพิกัด pixel บนหน้าจอได้แม่นยำ
            const rect = box.getBoundingClientRect();
            box.style.transform = 'none';
            box.style.top = rect.top + 'px';
            box.style.left = rect.left + 'px';

            startX = e.clientX;
            startY = e.clientY;
            initialX = box.offsetLeft;
            initialY = box.offsetTop;

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            box.style.left = (initialX + dx) + 'px';
            box.style.top = (initialY + dy) + 'px';
        }

        function onMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
    </script>
</body>
</html>
