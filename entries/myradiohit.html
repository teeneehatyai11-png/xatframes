<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit - Player Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: transparent; /* โปร่งใสเพื่อให้ซ้อนกับ xat ได้ */
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    /* เครื่องเล่นเพลงฝั่งซ้าย */
    .player-container {
      width: 240px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-title {
      font-size: 12px;
      color: #94a3b8;
      align-self: flex-start;
      margin-bottom: 15px;
    }

    .disc-outer {
      width: 120px;
      height: 120px;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      margin-bottom: 15px;
      position: relative;
    }

    .disc-inner {
      width: 100px;
      height: 100px;
      background: #1e293b;
      border: 4px solid #334155;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .disc-center {
      width: 30px;
      height: 30px;
      background: #38bdf8;
      border-radius: 50%;
      border: 3px solid #0f172a;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .track-title {
      font-size: 14px;
      font-weight: bold;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-category {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    .btn:hover {
      color: #38bdf8;
    }

    .btn-play {
      width: 40px;
      height: 40px;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 50%;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-play:hover {
      background: #7dd3fc;
      color: #0f172a;
    }

    .volume-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-slider {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* รายการเพลงฝั่งขวา */
    .playlist-container {
      width: 240px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      max-height: 80vh;
      overflow-y: auto;
    }

    .playlist-header {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #f8fafc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .playlist-item {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: 0.2s;
      font-size: 12px;
    }

    .playlist-item:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .playlist-item.active {
      background: rgba(56, 189, 248, 0.3);
      border-left: 3px solid #38bdf8;
    }

    .item-title {
      color: #e2e8f0;
      font-weight: 600;
    }

    .item-sub {
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- ฝั่งซ้าย: เครื่องเล่นวิทยุ -->
  <div class="player-container">
    <div class="player-title">MYRADIOhit Radio Player</div>
    
    <div class="disc-outer">
      <div class="disc-inner" id="disc">
        <div class="disc-center"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">เลือกเพลงเพื่อเริ่มเล่น</div>
      <div class="track-category" id="trackCategory">MYRADIOhit Online</div>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevTrack()">⏮</button>
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="btn" onclick="nextTrack()">⏭</button>
    </div>

    <div class="volume-container">
      <span style="font-size:10px;">🔈</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
      <span style="font-size:10px;">🔊</span>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <!-- ฝั่งขวา: รายการเพลง -->
  <div class="playlist-container">
    <div class="playlist-header">Playlist</div>
    <div id="playlistItems"></div>
  </div>

  <script>
    // ข้อมูลสถานีและเพลงทั้งหมด
    const tracks = [
      {
        title: "#1 Tag Hits String 2026",
        category: "เพลงสตริงใหม่ล่าสุด",
        url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3"
      },
      {
        title: "#2 Thaistation Radio Mix",
        category: "เพลงสตริง",
        url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3"
      },
      {
        title: "#3 String Pop Selection #1",
        category: "สตริง 1",
        url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3"
      },
      {
        title: "#4 2-Hour Nonstop String Hits",
        category: "สตริง 2 ชม.",
        url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3"
      },
      {
        title: "#5 Thai Country Music",
        category: "เพลงลูกทุ่ง",
        url: "https://ia600903.us.archive.org/29/items/luk-thung-music/Luk%20Thung%20music.mp3"
      },
      {
        title: "#6 Southern Folk Hits Collection",
        category: "เพลงใต้ ชุดใหม่",
        url: "https://ia601609.us.archive.org/27/items/plangtai2/plangtai2.mp3"
      },
      {
        title: "#7 Southern Melodic Vibes",
        category: "เพลงใต้ แนวเพราะ",
        url: "https://files.catbox.moe/k4dtxi.mp3"
      }
    ];

    let currentTrackIndex = 0;
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const disc = document.getElementById('disc');
    const trackTitle = document.getElementById('trackTitle');
    const trackCategory = document.getElementById('trackCategory');

    // Render รายการเพลง
    function renderPlaylist() {
      const container = document.getElementById('playlistItems');
      container.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
        item.onclick = () => loadTrack(index, true);
        item.innerHTML = `
          <div class="item-title">${track.title}</div>
          <div class="item-sub">${track.category}</div>
        `;
        container.appendChild(item);
      });
    }

    function loadTrack(index, autoPlay = false) {
      currentTrackIndex = index;
      audio.src = tracks[index].url;
      trackTitle.innerText = tracks[index].title;
      trackCategory.innerText = tracks[index].category;
      renderPlaylist();

      if (autoPlay) {
        playTrack();
      }
    }

    function togglePlay() {
      if (audio.paused) {
        playTrack();
      } else {
        pauseTrack();
      }
    }

    function playTrack() {
      if (!audio.src) {
        loadTrack(0, true);
        return;
      }
      audio.play().then(() => {
        playBtn.innerText = '⏸';
        disc.style.animationPlayState = 'running';
      }).catch(e => console.log("Playback error:", e));
    }

    function pauseTrack() {
      audio.pause();
      playBtn.innerText = '▶';
      disc.style.animationPlayState = 'paused';
    }

    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex, true);
    }

    function prevTrack() {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentTrackIndex, true);
    }

    function changeVolume(val) {
      audio.volume = val;
    }

    // เริ่มต้นหน้าเว็บ
    loadTrack(0, false);
  </script>
</body>
</html>
