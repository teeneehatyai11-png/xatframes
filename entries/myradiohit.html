<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit xatframe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fff;
        }
        .xatframe-wrapper {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 30px;
        }
        
        /* ด้านซ้าย: เครื่องเล่นวิทยุ */
        .player-card {
            width: 230px; background: rgba(10, 16, 26, 0.90); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 12px; padding: 15px;
            display: flex; flex-direction: column; align-items: center; z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .turntable { position: relative; width: 100px; height: 100px; margin-bottom: 10px; }
        .vinyl {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle, #333 15%, #111 18%, #111 38%, #222 40%, #111 42%, #111 68%, #000 70%);
            border: 3px solid #222; display: flex; align-items: center; justify-content: center;
            animation: spin 4s linear infinite; animation-play-state: paused;
        }
        .vinyl.playing { animation-play-state: running; }
        .vinyl-center { width: 28px; height: 28px; background: #00f0ff; border-radius: 50%; border: 2px solid #fff; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .play-btn-custom {
            padding: 10px 20px; border-radius: 20px; background: #00f0ff; color: #000;
            border: none; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%;
            box-shadow: 0 0 10px rgba(0,240,255,0.4); font-size: 13px; transition: all 0.2s;
        }

        /* ตรงกลาง: เว้นว่างให้กรอบแชต xat */
        .chat-space { width: 650px; height: 486px; pointer-events: none; }

        /* ด้านขวา: แสดงสถานะ */
        .playlist-card {
            width: 230px; background: rgba(10, 16, 26, 0.90); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 15px; z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .status-box {
            padding: 10px; background: rgba(0,240,255,0.1); border: 1px solid rgba(0,240,255,0.3);
            border-radius: 8px; font-size: 12px; color: #00f0ff; text-align: center; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="xatframe-wrapper">
        <!-- ด้านซ้าย: เครื่องเล่นเพลง -->
        <div class="player-card">
            <div style="font-size:12px; color:#00f0ff; margin-bottom:8px; font-weight:bold;">📻 MYRADIOHIT</div>
            <div class="turntable">
                <div class="vinyl" id="vinylRecord"><div class="vinyl-center"></div></div>
            </div>
            <div style="font-size:12px; font-weight:bold; margin-bottom:4px; text-align:center;" id="songTitle">วิทยุออนไลน์ 24 ช.ม.</div>
            
            <button class="play-btn-custom" onclick="togglePlay()" id="mainPlayBtn">▶ CLICK TO PLAY</button>
            
            <!-- ใช้แท็ก Audio ดั้งเดิมที่กดเล่นติดแน่ๆ -->
            <audio id="radioPlayer" src="https://radio14.plathong.net/7056/;stream.mp3?type=http" preload="none"></audio>
        </div>

        <!-- ตรงกลาง: เว้นว่างไว้สำหรับแชต xat -->
        <div class="chat-space"></div>

        <!-- ด้านขวา: ข้อมูลสถานะ -->
        <div class="playlist-card">
            <div style="font-size:13px; font-weight:bold; color:#00f0ff; margin-bottom:8px;">📋 Station Status</div>
            <div class="status-box" id="statusText">🔴 ปิดเสียงอยู่ (OFF)</div>
        </div>
    </div>

    <script>
        const player = document.getElementById('radioPlayer');
        const vinyl = document.getElementById('vinylRecord');
        const mainPlayBtn = document.getElementById('mainPlayBtn');
        const statusText = document.getElementById('statusText');

        function togglePlay() {
            if (player.paused) {
                // คำสั่งเล่นเพลง
                player.play().then(() => {
                    vinyl.classList.add('playing');
                    mainPlayBtn.innerText = '❚❚ PAUSE (หยุด)';
                    mainPlayBtn.style.background = '#ff0055';
                    mainPlayBtn.style.color = '#fff';
                    statusText.innerText = '🟢 กำลังเล่นเพลง (LIVE)';
                    statusText.style.color = '#00ff88';
                }).catch(err => {
                    alert('กรุณากดคลิกบนหน้าจอ 1 ครั้งแล้วกดปุ่มเล่นอีกครั้งครับ');
                });
            } else {
                // คำสั่งหยุดเพลงชัวร์ 100% (เคลียร์สตรีมสดเพื่อไม่ให้ค้าง)
                player.pause();
                player.currentTime = 0;
                vinyl.classList.remove('playing');
                mainPlayBtn.innerText = '▶ CLICK TO PLAY';
                mainPlayBtn.style.background = '#00f0ff';
                mainPlayBtn.style.color = '#000';
                statusText.innerText = '🔴 ปิดเสียงอยู่ (OFF)';
                statusText.style.color = '#ff0055';
            }
        }
    </script>

</body>
</html>
