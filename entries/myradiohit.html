<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', Arial, sans-serif;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            position: relative;
            pointer-events: none;
        }

        /* เครื่องเล่นวิทยุด้านซ้าย (พร้อมวิดีโอ 03.mp4 พื้นหลัง) */
        .player-container {
            position: absolute;
            top: 130px;
            left: 15px;
            width: 280px;
            height: 480px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* ดันเนื้อหาลงด้านล่าง */
            z-index: 999999 !important;
            pointer-events: auto !important;
            overflow: hidden;
        }

        /* Playlist ด้านขวา (พร้อมวิดีโอ 02.mp4 พื้นหลัง) */
        .playlist-container {
            position: absolute;
            top: 130px;
            right: 15px;
            width: 280px;
            height: 480px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* ดันเนื้อหาลงด้านล่าง ไม่บังหน้าคน */
            z-index: 999999 !important;
            pointer-events: auto !important;
            overflow: hidden;
        }

        /* วิดีโอพื้นหลังวนลูป */
        .video-bg-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            border-radius: 12px;
        }
        .video-bg-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            outline: none;
            opacity: 0.45;
        }

        /* เลเยอร์เนื้อหาทับด้านบนวิดีโอ */
        .content-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .vinyl-box {
            width: 110px;
            height: 110px;
            background: #000;
            border-radius: 50%;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #1e293b;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .vinyl-center {
            width: 36px;
            height: 36px;
            background: #0ea5e9;
            border-radius: 50%;
        }
        .now-playing {
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .track-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        audio {
            width: 100%;
            height: 35px;
            outline: none;
        }

        .playlist-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            color: #fff;
        }
        .playlist-scroll {
            max-height: 160px;
            overflow-y: auto;
        }
        .playlist-item {
            padding: 8px;
            margin-bottom: 6px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
            color: #fff;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.3);
        }
        .playlist-item .cat {
            font-size: 10px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- ส่วนเครื่องเล่นเพลง (ซ้าย) พร้อมวิดีโอ 03.mp4 -->
    <div class="player-container">
        <div class="video-bg-box">
            <video autoplay loop muted playsinline preload="auto">
                <source src="https://ia903200.us.archive.org/8/items/03_20261008_20261008_1411/03.mp4" type="video/mp4">
            </video>
        </div>

        <div class="content-layer">
            <div class="player-header">Myradiohit Radio Player</div>
            <div class="vinyl-box">
                <div class="vinyl-center"></div>
            </div>
            <div class="now-playing">NOW PLAYING</div>
            <div class="track-title" id="current-title">Select a track to start</div>
            <audio id="audio-player" controls preload="metadata"></audio>
        </div>
    </div>

    <!-- ส่วนรายการเพลง Playlist (ขวา) พร้อมวิดีโอ 02.mp4 -->
    <div class="playlist-container">
        <div class="video-bg-box">
            <video autoplay loop muted playsinline preload="auto">
                <source src="https://ia903201.us.archive.org/13/items/02_20261008/02.mp4" type="video/mp4">
            </video>
        </div>

        <div class="content-layer">
            <div class="playlist-title">Playlist</div>
            
            <div class="playlist-scroll">
                <div class="playlist-item" onclick="playTrack('#1 Tag Hits String 2026', 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3')">
                    <div>#1 Tag Hits String 2026</div>
                    <div class="cat">Category: String</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function playTrack(title, url) {
            const player = document.getElementById('audio-player');
            const titleElement = document.getElementById('current-title');
            
            titleElement.innerText = title;
            player.src = url;
            player.play().catch(function(error) {
                console.log("Playback error: ", error);
            });
        }
    </script>
</body>
</html>
