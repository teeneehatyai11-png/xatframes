<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit - Player Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    /* สำคัญ: ให้คลิกทะลุพื้นที่ว่างทั้งหมดไปยังห้องแชท xat */
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      pointer-events: none;
    }

    body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    /* รับการคลิกเฉพาะตัวกล่องวิทยุและรายการเพลง */
    .interactive-box {
      pointer-events: auto !important;
    }

    /* กล่องเครื่องเล่นวิทยุฝั่งซ้าย */
    .player-container {
      width: 250px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 16px;
      padding: 18px 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7),
                  inset 0 0 15px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      align-self: flex-start;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .disc-outer {
      width: 120px;
      height: 120px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      margin-bottom: 15px;
      border: 2px solid rgba(56, 189, 248, 0.3);
    }

    .disc-inner {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 4px solid #334155;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }

    .disc-center {
      width: 30px;
      height: 30px;
      background: #38bdf8;
      border-radius: 50%;
      border: 4px solid #0f172a;
      box-shadow: 0 0 8px #38bdf8;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .track-title {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .track-category {
      font-size: 11px;
      color: #38bdf8;
    }

    .status-text {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      height: 14px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 15px;
      width: 100%;
    }

    .btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      color: #38bdf8;
      transform: scale(1.15);
    }

    .btn-play {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      border-radius: 50%;
      font-size: 20px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .btn-play:hover {
      background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
      color: #0f172a;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
    }

    .volume-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 5px;
    }

    .volume-slider {
      width: 100%;
      height: 4px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* กล่องรายการเพลงฝั่งขวา */
    .playlist-container {
      width: 250px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7),
                  inset 0 0 15px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .playlist-header {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-scroll {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .playlist-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .playlist-scroll::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 4px;
    }

    .playlist-item {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-item:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .playlist-item.active {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .item-num {
      font-size: 11px;
      color: #38bdf8;
      font-weight: bold;
      min-width: 18px;
    }

    .item-info {
      overflow: hidden;
    }

    .item-title {
      color: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 9px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- ฝั่งซ้าย: เครื่องเล่นวิทยุ -->
  <div class="player-container interactive-box">
    <div class="player-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      MYRADIOhit
    </div>
    
    <div class="disc-outer">
      <div class="disc-inner" id="disc">
        <div class="disc-center"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">#1 สตริงใหม่ล่าสุด 2026</div>
      <div class="track-category" id="trackCategory">เพลงสตริงใหม่ล่าสุด</div>
      <div class="status-text" id="statusText">กด Play เพื่อฟังเพลง</div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" title="เพลงก่อนหน้า">⏮</button>
      <button class="btn btn-play" id="playBtn" title="เล่น/หยุด">▶</button>
      <button class="btn" id="nextBtn" title="เพลงถัดไป">⏭</button>
    </div>

    <div class="volume-container">
      <span style="font-size:10px;">🔈</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
      <span style="font-size:10px;">🔊</span>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <!-- ฝั่งขวา: รายการเพลง -->
  <div class="playlist-container interactive-box">
    <div class="playlist-header">
      <span>รายการเพลง</span>
      <span style="font-size:10px; color:#94a3b8;">7 รายการ</span>
    </div>
    <div class="playlist-scroll" id="playlistItems"></div>
  </div>

  <script>
    const tracks = [
      {
        title: "#1 สตริงใหม่ล่าสุด 2026",
        category: "เพลงสตริงใหม่ล่าสุด",
        url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3"
      },
      {
        title: "#2 Thaistation Radio Mix",
        category: "เพลงสตริง",
        url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3"
      },
      {
        title: "#3 String Pop Selection",
        category: "สตริง 1",
        url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3"
      },
      {
        title: "#4 2-Hour Nonstop Hits",
        category: "สตริง 2 ชม.",
        url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3"
      },
      {
        title: "#5 Thai Country Favorites",
        category: "เพลงลูกทุ่ง",
        url: "https://ia600903.us.archive.org/29/items/luk-thung-music/Luk%20Thung%20music.mp3"
      },
      {
        title: "#6 Southern Hits New Coll...",
        category: "เพลงใต้ ชุดใหม่",
        url: "https://ia601609.us.archive.org/27/items/plangtai2/plangtai2.mp3"
      },
      {
        title: "#7 Southern Melodic Folk",
        category: "เพลงใต้ แนวเพราะ",
        url: "https://files.catbox.moe/k4dtxi.mp3"
      }
    ];

    let currentTrackIndex = 0;
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const disc = document.getElementById('disc');
    const trackTitle = document.getElementById('trackTitle');
    const trackCategory = document.getElementById('trackCategory');
    const statusText = document.getElementById('statusText');

    function renderPlaylist() {
      const container = document.getElementById('playlistItems');
      container.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
        item.onclick = () => selectAndPlay(index);
        item.innerHTML = `
          <div class="item-num">${index + 1}</div>
          <div class="item-info">
            <div class="item-title">${track.title}</div>
            <div class="item-sub">${track.category}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function updateTrackInfo(index) {
      currentTrackIndex = index;
      trackTitle.innerText = tracks[index].title;
      trackCategory.innerText = tracks[index].category;
      renderPlaylist();
    }

    function playAudio() {
      statusText.innerText = "กำลังโหลดสัญญาณเพลง...";
      statusText.style.color = "#38bdf8";

      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          playBtn.innerText = '⏸';
          disc.style.animationPlayState = 'running';
          statusText.innerText = "● กำลังเล่นเพลง";
          statusText.style.color = "#4ade80";
        }).catch(err => {
          console.log("Play failed:", err);
          playBtn.innerText = '▶';
          disc.style.animationPlayState = 'paused';
          statusText.innerText = "กดอีกครั้งเพื่อเล่นเพลง";
          statusText.style.color = "#f87171";
        });
      }
    }

    function selectAndPlay(index) {
      updateTrackInfo(index);
      audio.src = tracks[index].url;
      playAudio();
    }

    function togglePlay() {
      if (!audio.src || audio.src === "" || audio.src === window.location.href) {
        selectAndPlay(0);
        return;
      }

      if (audio.paused) {
        playAudio();
      } else {
        audio.pause();
        playBtn.innerText = '▶';
        disc.style.animationPlayState = 'paused';
        statusText.innerText = "หยุดเล่นชั่วคราว";
        statusText.style.color = "#94a3b8";
      }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => {
      const prevIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      selectAndPlay(prevIndex);
    });
    nextBtn.addEventListener('click', () => {
      const nextIndex = (currentTrackIndex + 1) % tracks.length;
      selectAndPlay(nextIndex);
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    audio.addEventListener('ended', () => {
      const nextIndex = (currentTrackIndex + 1) % tracks.length;
      selectAndPlay(nextIndex);
    });

    audio.addEventListener('error', () => {
      statusText.innerText = "ไม่สามารถเล่นเพลงนี้ได้";
      statusText.style.color = "#f87171";
      playBtn.innerText = '▶';
      disc.style.animationPlayState = 'paused';
    });

    // ตั้งค่าเพลงเริ่มต้น
    updateTrackInfo(0);
    audio.src = tracks[0].url;
  </script>
</body>
</html>
