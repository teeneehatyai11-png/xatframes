<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit Player - Live Frame</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', Arial, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }

    /* 🖼️ การ์ดฝั่งซ้าย (วิดีโอ yc18zg.mp4) */
    .left-card {
      position: absolute;
      top: 130px;
      left: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    /* 📱 การ์ดฝั่งขวา (วิดีโอ s9d6v6.mp4 + เครื่องเล่นวิทยุ) */
    .right-card {
      position: absolute;
      top: 130px;
      right: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    .video-bg-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .video-bg-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: none;
    }

    .card-content-overlay {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(10, 15, 30, 0.95) 0%, rgba(10, 15, 30, 0.2) 60%, rgba(10, 15, 30, 0.8) 100%);
      margin: -12px;
      padding: 14px;
    }

    .radio-header {
      font-size: 14px;
      font-weight: 700;
      color: #ff0050;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 0, 80, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff0050;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0050, 0 0 20px #ff0050;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* กล่องเครื่องเล่นวิทยุกระจกพ่นฝ้า (Glassmorphism Custom Player) */
    .glass-player {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-info {
      text-align: center;
    }

    .now-playing {
      font-size: 9px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .playlist-select:hover {
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .playlist-select option {
      background: #0f172a;
      color: #fff;
    }

    /* ปุ่มเล่นเพลงเรืองแสงขนาดใหญ่ */
    .btn-play {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff0050 0%, #a855f7 50%, #00f2fe 100%);
      background-size: 200% auto;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(255, 0, 80, 0.5);
      transition: all 0.3s ease;
    }

    .btn-play:hover {
      background-position: right center;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.7);
      transform: translateY(-1px);
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    /* แถบปรับเสียง Volume Slider */
    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .volume-btn {
      background: none;
      border: none;
      color: #00f2fe;
      font-size: 12px;
      cursor: pointer;
      width: 16px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #00f2fe;
      cursor: pointer;
      box-shadow: 0 0 8px #00f2fe;
    }

    /* ไฟวิ่ง Equalizer */
    .eq-container {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .eq-bar {
      width: 2px;
      background: #00f2fe;
      border-radius: 1px;
      height: 30%;
    }

    .playing .eq-bar {
      animation: eqAnimation 0.8s infinite alternate ease-in-out;
    }

    .playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes eqAnimation {
      0% { height: 20%; }
      100% { height: 100%; }
    }
  </style>
</head>
<body>

  <!-- 🖼️ ฝั่งซ้าย (วิดีโอ yc18zg.mp4) -->
  <div class="left-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- 📱 ฝั่งขวา (วิดีโอ s9d6v6.mp4 + วิทยุกระจกพ่นฝ้า) -->
  <div class="right-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card-content-overlay">
      <!-- ส่วนหัวแสดงคำว่า Live แทน MYRADIOhit -->
      <div class="radio-header">
        <div class="live-dot"></div>
        <span>Live</span>
      </div>

      <!-- เครื่องเล่นแบบ Custom Audio Player -->
      <div class="glass-player">
        <div class="song-info">
          <div class="now-playing">
            <div id="eq-widget" class="eq-container">
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
            </div>
            <span id="status-label">NOW PLAYING</span>
          </div>
          <div class="track-title" id="current-title">1. รวมเพลงเพราะฟังสบาย</div>
        </div>

        <!-- รายการตัวเลือกเพลง -->
        <select class="playlist-select" id="station-select" onchange="changeStation(this)">
          <option value="https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3">1. รวมเพลงเพราะฟังสบาย</option>
          <option value="https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3">2. รวมเพลงเพราะฟังสบายตอนทำงาน</option>
          <option value="https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3">3. รวมเพลงเพราะฟังสบาย (สถานี 3)</option>
          <option value="https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3">4. รวมเพลงเพราะวันพักผ่อน</option>
        </select>

        <!-- แถบควบคุมระดับเสียง -->
        <div class="volume-box">
          <button class="volume-btn" id="mute-btn" onclick="toggleMute()">
            <i class="fa-solid fa-volume-high" id="volume-icon"></i>
          </button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)">
        </div>

        <!-- ปุ่มเล่น/หยุดเพลงขนาดใหญ่ -->
        <button class="btn-play" id="play-btn" onclick="togglePlay()">
          <i class="fa-solid fa-play" id="play-icon"></i>
          <span id="play-text">กดเพื่อฟังเพลง</span>
        </button>
      </div>
    </div>
  </div>

  <!-- แท็กเสียง Audio ด้านหลัง -->
  <audio id="audio-player" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const select = document.getElementById('station-select');
    const title = document.getElementById('current-title');
    const eqWidget = document.getElementById('eq-widget');
    const volumeIcon = document.getElementById('volume-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const statusLabel = document.getElementById('status-label');

    let isPlaying = false;

    // ตั้งค่าเพลงตั้งต้น
    window.addEventListener('DOMContentLoaded', () => {
      audio.src = select.value;
      audio.volume = 0.8;
    });

    // ฟังก์ชัน สลับ เล่น/หยุด เพลง
    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        updateUI(false);
      } else {
        audio.play().then(() => {
          isPlaying = true;
          updateUI(true);
        }).catch(err => {
          console.log("Autoplay failed:", err);
          statusLabel.textContent = "กดอีกครั้งเพื่อเล่น";
        });
      }
    }

    // อัปเดตการแสดงผลปุ่มและไฟวิ่ง
    function updateUI(playing) {
      if (playing) {
        playIcon.className = "fa-solid fa-pause";
        playText.textContent = "หยุดเพลง";
        statusLabel.textContent = "NOW PLAYING";
        eqWidget.classList.add('playing');
      } else {
        playIcon.className = "fa-solid fa-play";
        playText.textContent = "กดเพื่อฟังเพลง";
        statusLabel.textContent = "PAUSED";
        eqWidget.classList.remove('playing');
      }
    }

    // เปลี่ยนสถานีเพลง
    function changeStation(elem) {
      const selectedOption = elem.options[elem.selectedIndex];
      audio.src = elem.value;
      title.textContent = selectedOption.text;
      
      audio.play().then(() => {
        isPlaying = true;
        updateUI(true);
      }).catch(err => {
        console.log("Play on change blocked:", err);
      });
    }

    // ปรับระดับเสียง
    function setVolume(val) {
      audio.volume = val;
      updateVolumeIcon(val);
    }

    // ปิด/เปิดเสียง Mute
    function toggleMute() {
      if (audio.volume > 0) {
        audio.dataset.lastVol = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
      } else {
        const last = audio.dataset.lastVol || 0.8;
        audio.volume = last;
        volumeSlider.value = last;
      }
      updateVolumeIcon(audio.volume);
    }

    function updateVolumeIcon(vol) {
      if (vol == 0) {
        volumeIcon.className = "fa-solid fa-volume-xmark";
      } else if (vol < 0.5) {
        volumeIcon.className = "fa-solid fa-volume-low";
      } else {
        volumeIcon.className = "fa-solid fa-volume-high";
      }
    }

    // เล่นเพลงถัดไปอัตโนมัติเมื่อจบเพลง
    audio.addEventListener('ended', () => {
      let nextIndex = (select.selectedIndex + 1) % select.options.length;
      select.selectedIndex = nextIndex;
      changeStation(select);
    });
  </script>

</body>
</html>
