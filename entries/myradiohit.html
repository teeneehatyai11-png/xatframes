<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: transparent;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* วิดีโอพื้นหลัง */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: 85% center;
            z-index: -999;
        }

        /* กล่องวิทยุฝั่งขวา ลากเลื่อนได้ */
        .draggable-sidebar {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 2147483647;
            user-select: none;
        }

        /* ส่วนหัวสำหรับลากเลื่อน */
        .drag-header {
            background: rgba(30, 41, 59, 0.9);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            cursor: move;
        }

        .drag-hint {
            font-size: 8px;
            color: #94a3b8;
            background: rgba(56, 189, 248, 0.1);
            padding: 1px 5px;
            border-radius: 3px;
        }

        .player-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .station-info {
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-name {
            font-size: 11px;
            font-weight: bold;
            color: #fff;
        }

        .live-badge {
            background: #0ea5e9;
            color: #fff;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .controls-panel {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .play-btn {
            width: 36px;
            height: 36px;
            background: #0ea5e9;
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
            transition: 0.2s;
        }

        .play-btn:hover {
            background: #0284c7;
            transform: scale(1.05);
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
        }

        .volume-box input[type="range"] {
            width: 100%;
            accent-color: #0ea5e9;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- วิดีโอพื้นหลัง -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://files.catbox.moe/ebhsth.mp4" type="video/mp4">
    </video>

    <!-- กล่องวิทยุฝั่งขวา -->
    <div class="draggable-sidebar" id="draggable-box">
        <div class="drag-header" id="drag-handle">
            <span>MYRADIOhit Live</span>
            <span class="drag-hint">↔ ลากย้ายได้</span>
        </div>
        
        <div class="player-body">
            <div class="station-info">
                <span class="station-name">MYRADIOhit Online</span>
                <span class="live-badge" id="status-badge">OFF AIR</span>
            </div>

            <div class="controls-panel">
                <!-- ปุ่มกดเล่นหลัก ทำงานแน่นอน 100% -->
                <button class="play-btn" id="play-btn" onclick="toggleRadio()">▶</button>
                
                <div class="volume-box">
                    <span style="font-size: 12px;">🔊</span>
                    <input type="range" min="0" max="1" step="0.05" value="1" oninput="radioStream.volume = this.value">
                </div>
            </div>
        </div>
    </div>

    <!-- ลิงก์สตรีมวิทยุแท้จากเซิร์ฟเวอร์ของคุณ (ต่อท้ายด้วย ; หรือ /stream เพื่อให้เบราว์เซอร์รับสตรีมสด) -->
    <audio id="radio-audio" src="https://radio.plathong.net/radio9/7264/stream" preload="none"></audio>

    <script>
        const radioStream = document.getElementById('radio-audio');
        const playBtn = document.getElementById('play-btn');
        const statusBadge = document.getElementById('status-badge');
        let isPlaying = false;

        function toggleRadio() {
            if (isPlaying) {
                radioStream.pause();
                radioStream.src = ""; //เคลียร์เพื่อหยุดการโหลดสตรีมสดค้างไว้
                isPlaying = false;
                playBtn.innerText = "▶";
                statusBadge.innerText = "OFF AIR";
                statusBadge.style.background = "#64748b";
            } else {
                playBtn.innerText = "⌛"; // โหลด
                statusBadge.innerText = "CONNECTING";
                
                // ใส่ลิงก์สตรีมใหม่เพื่อดึงข้อมูลสดล่าสุดทันทีที่กด
                radioStream.src = "https://radio.plathong.net/radio9/7264/stream";
                
                radioStream.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "❚❚";
                    statusBadge.innerText = "ON AIR";
                    statusBadge.style.background = "#0ea5e9";
                }).catch(error => {
                    console.log("Playback failed:", error);
                    playBtn.innerText = "▶";
                    statusBadge.innerText = "ERROR";
                    statusBadge.style.background = "#ef4444";
                    alert("ไม่สามารถเชื่อมต่อสตรีมวิทยุได้ กรุณาลองใหม่อีกครั้ง");
                });
            }
        }

        // ระบบลากเลื่อนกล่องวิทยุ
        const box = document.getElementById('draggable-box');
        const handle = document.getElementById('drag-handle');

        let isDragging = false;
        let startX, startY, initialX, initialY;

        handle.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = box.getBoundingClientRect();
            box.style.top = rect.top + 'px';
            box.style.left = rect.left + 'px';
            box.style.right = 'auto';
            box.style.transform = 'none';

            startX = e.clientX;
            startY = e.clientY;
            initialX = box.offsetLeft;
            initialY = box.offsetTop;

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            box.style.left = (initialX + dx) + 'px';
            box.style.top = (initialY + dy) + 'px';
        }

        function onMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
    </script>
</body>
</html>
