<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', Arial, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }

    /* 🖼️ การ์ดฝั่งซ้าย (วิดีโอ yc18zg.mp4) */
    .left-card {
      position: absolute;
      top: 130px;
      left: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    /* 📱 การ์ดฝั่งขวา (วิดีโอ s9d6v6.mp4 + เครื่องเล่นวิทยุ) */
    .right-card {
      position: absolute;
      top: 130px;
      right: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    /* วิดีโอวนลูปพื้นหลัง */
    .video-bg-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .video-bg-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: none;
    }

    /* ครอบเลเยอร์ส่วนควบคุมฝั่งขวา */
    .card-content-overlay {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(10, 15, 30, 0.9) 0%, rgba(10, 15, 30, 0.2) 50%, rgba(10, 15, 30, 0.8) 100%);
      margin: -12px;
      padding: 14px;
    }

    .radio-header {
      font-size: 14px;
      font-weight: 700;
      color: #ff0050;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(ff, 0, 80, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff0050;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0050;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* กล่องเครื่องเล่นวิทยุกระจกโปร่งแสง (Glassmorphism Widget) */
    .glass-player {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-info {
      text-align: center;
    }

    .now-playing {
      font-size: 9px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
      text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* กล่องเลือกช่องสถานีเพลง */
    .playlist-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }

    .playlist-select option {
      background: #12121c;
      color: #fff;
    }

    /* ปุ่มเล่นเพลงสไตล์เกรเดียนต์ตรงตามรูป "กดเพื่อฟังวิทยุสด" */
    .play-btn-large {
      width: 100%;
      padding: 10px;
      background: linear-gradient(90deg, #d91c5c 0%, #00c6ff 100%);
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(217, 28, 92, 0.5);
      transition: all 0.2s ease;
    }

    .play-btn-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
    }

    .play-btn-large:active {
      transform: translateY(0);
    }

    /* ตัวควบคุมความดังเสียง */
    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a0aec0;
      font-size: 11px;
      padding: 0 4px;
    }

    .volume-box input[type="range"] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      accent-color: #00f2fe;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- แท็กเสียง Audio ซ่อนสำหรับเล่นแบบ Background -->
  <audio id="audio-player" preload="auto" crossorigin="anonymous"></audio>

  <!-- 🖼️ ฝั่งซ้าย (วิดีโอ yc18zg.mp4)[cite: 1] -->
  <div class="left-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- 📱 ฝั่งขวา (วิดีโอ s9d6v6.mp4 + เครื่องเล่นวิทยุ)[cite: 1] -->
  <div class="right-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card-content-overlay">
      <!-- ข้อความส่วนหัวเปลี่ยนเป็น LIVE ตามที่ระบุ -->
      <div class="radio-header">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>

      <!-- เครื่องเล่นเพลง -->
      <div class="glass-player">
        <div class="song-info">
          <div class="now-playing">NOW PLAYING</div>
          <div class="track-title" id="current-title">รวมเพลงเพราะฟังสบาย</div>
        </div>

        <!-- รายการเลือกสถานีเพลง -->
        <select class="playlist-select" id="station-select" onchange="selectStation(this.value)">
          <option value="0">1. รวมเพลงเพราะฟังสบาย</option>
          <option value="1">2. รวมเพลงเพราะฟังสบายตอนทำงาน</option>
          <option value="2">3. รวมเพลงเพราะฟังสบาย (สถานีที่ 3)</option>
          <option value="3">4. รวมเพลงเพราะวันพักผ่อน</option>
        </select>

        <!-- ตัวปรับความดังเสียง -->
        <div class="volume-box">
          <i class="fas fa-volume-up" id="vol-icon"></i>
          <input type="range" id="volume-range" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)">
        </div>

        <!-- ปุ่มกดเล่นเพลงขนาดใหญ่แบบในภาพ -->
        <button class="play-btn-large" id="main-play-btn" onclick="togglePlay()">
          <i class="fas fa-play" id="btn-icon"></i>
          <span id="btn-text">กดเพื่อฟังวิทยุสด</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const playlist = [
      { name: "รวมเพลงเพราะฟังสบาย", url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3" },
      { name: "รวมเพลงเพราะฟังสบายตอนทำงาน", url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3" },
      { name: "รวมเพลงเพราะฟังสบาย (สถานีที่ 3)", url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3" },
      { name: "รวมเพลงเพราะวันพักผ่อน", url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const mainPlayBtn = document.getElementById('main-play-btn');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const title = document.getElementById('current-title');
    const stationSelect = document.getElementById('station-select');

    let currentIndex = 0;
    let isPlaying = false;

    // ตั้งค่าเพลงเริ่มต้น
    audio.src = playlist[0].url;

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        updateUI(false);
      } else {
        // โหลดเนื้อหาใหม่และสั่งเล่นเพื่อแก้ปัญหากดเล่นไม่ได้
        if (!audio.src) {
          audio.src = playlist[currentIndex].url;
        }
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            updateUI(true);
          }).catch(error => {
            console.log("Autoplay / Audio Error: ", error);
            // กรณีโดนบล็อก ให้พยายามโหลดและเล่นอีกครั้ง
            audio.load();
            audio.play().then(() => updateUI(true));
          });
        }
      }
    }

    function selectStation(index) {
      currentIndex = parseInt(index);
      title.textContent = playlist[currentIndex].name;
      audio.src = playlist[currentIndex].url;
      audio.load();
      
      audio.play().then(() => {
        updateUI(true);
      }).catch(err => {
        console.log("Error loading station:", err);
        updateUI(false);
      });
    }

    function setVolume(val) {
      audio.volume = val;
      const volIcon = document.getElementById('vol-icon');
      if (val == 0) {
        volIcon.className = 'fas fa-volume-mute';
      } else if (val < 0.5) {
        volIcon.className = 'fas fa-volume-down';
      } else {
        volIcon.className = 'fas fa-volume-up';
      }
    }

    function updateUI(playing) {
      isPlaying = playing;
      if (playing) {
        btnIcon.className = 'fas fa-pause';
        btnText.textContent = 'หยุดฟังวิทยุ';
      } else {
        btnIcon.className = 'fas fa-play';
        btnText.textContent = 'กดเพื่อฟังวิทยุสด';
      }
    }

    // เมื่อเพลงจบให้เล่นเพลงถัดไปอัตโนมัติ
    audio.addEventListener('ended', () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      stationSelect.value = currentIndex;
      selectStation(currentIndex);
    });

    // ปลดล็อกระบบ Audio Context เมื่อผู้ใช้มีการคลิกหน้าจอครั้งแรก
    document.body.addEventListener('click', function unlockAudio() {
      if (!isPlaying && audio.paused) {
        audio.play().then(() => {
          updateUI(true);
        }).catch(() => {});
      }
      document.body.removeEventListener('click', unlockAudio);
    }, { once: true });
  </script>

</body>
</html>
