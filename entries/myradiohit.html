<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
    }

    /* 🖼️ ฝั่งซ้าย (วิดีโอ yc18zg.mp4) */
    .left-card {
      position: absolute;
      top: 130px;
      left: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }

    /* 📱 ฝั่งขวา (วิดีโอ s9d6v6.mp4 + เครื่องเล่นวิทยุ) */
    .right-card {
      position: absolute;
      top: 130px;
      right: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
    }

    /* วิดีโอพื้นหลัง */
    .video-bg-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .video-bg-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay ฝั่งขวา */
    .card-content-overlay {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(10, 15, 30, 0.95) 0%, rgba(10, 15, 30, 0.2) 50%, rgba(10, 15, 30, 0.8) 100%);
      padding: 14px;
    }

    /* ข้อความส่วนหัว LIVE */
    .radio-header {
      font-size: 15px;
      font-weight: 700;
      color: #ff0050;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-shadow: 0 0 10px rgba(255, 0, 80, 0.8);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff0050;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0050;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* กล่องเครื่องเล่น Glassmorphism */
    .glass-player {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
    }

    .song-info {
      text-align: center;
      width: 100%;
    }

    .now-playing {
      font-size: 9px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
      text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .playlist-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.5);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .playlist-select option {
      background: #12121c;
      color: #fff;
    }

    /* 🔵 ปุ่มเปิด/ปิดเพลงแบบวงกลมสวยๆ */
    .round-play-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff007f, #00f2fe);
      border: 2px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6), 0 0 10px rgba(255, 0, 127, 0.6);
      transition: all 0.3s ease;
      margin: 4px 0;
    }

    .round-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.9), 0 0 15px rgba(255, 0, 127, 0.9);
    }

    .round-play-btn:active {
      transform: scale(0.95);
    }

    /* ปรับแต่งไอคอนในปุ่มให้ขยับตรงกลางสวยงาม */
    .round-play-btn i {
      margin-left: 2px; /* ดันไอคอนเล่นให้อยู่กลางปุ่ม */
    }

    .round-play-btn i.fa-pause {
      margin-left: 0;
    }

    /* แถบปรับระดับเสียง */
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a0aec0;
      font-size: 11px;
    }

    .volume-box input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: #00f2fe;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="audio-player" preload="none" crossorigin="anonymous"></audio>

  <!-- ฝั่งซ้าย (วิดีโอ yc18zg.mp4)[cite: 1] -->
  <div class="left-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- ฝั่งขวา (วิดีโอ s9d6v6.mp4 + วิทยุ)[cite: 1] -->
  <div class="right-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card-content-overlay">
      <div class="radio-header">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>

      <div class="glass-player">
        <div class="song-info">
          <div class="now-playing">NOW PLAYING</div>
          <div class="track-title" id="current-title">รวมเพลงเพราะฟังสบาย</div>
        </div>

        <select class="playlist-select" id="station-select">
          <option value="0">1. รวมเพลงเพราะฟังสบาย</option>
          <option value="1">2. รวมเพลงเพราะฟังสบายตอนทำงาน</option>
          <option value="2">3. รวมเพลงเพราะฟังสบาย (สถานีที่ 3)</option>
          <option value="3">4. รวมเพลงเพราะวันพักผ่อน</option>
        </select>

        <!-- 🔵 ปุ่มเปิดปิดกลม นีออนโปร่งแสง -->
        <button class="round-play-btn" id="main-play-btn" title="คลิกเปิด/ปิดเพลง">
          <i class="fas fa-play" id="btn-icon"></i>
        </button>

        <div class="volume-box">
          <i class="fas fa-volume-up"></i>
          <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </div>
  </div>

  <script>
    const playlist = [
      { name: "รวมเพลงเพราะฟังสบาย", url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3" },
      { name: "รวมเพลงเพราะฟังสบายตอนทำงาน", url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3" },
      { name: "รวมเพลงเพราะฟังสบาย (สถานีที่ 3)", url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3" },
      { name: "รวมเพลงเพราะวันพักผ่อน", url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const mainPlayBtn = document.getElementById('main-play-btn');
    const btnIcon = document.getElementById('btn-icon');
    const title = document.getElementById('current-title');
    const stationSelect = document.getElementById('station-select');
    const volumeRange = document.getElementById('volume-range');

    let currentIndex = 0;
    let isPlaying = false;

    // ฟังก์ชันเปิด/ปิดเพลงด้วยปุ่มกลม
    function togglePlay() {
      if (!audio.src || audio.src === "") {
        audio.src = playlist[currentIndex].url;
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        btnIcon.className = 'fas fa-play';
      } else {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            isPlaying = true;
            btnIcon.className = 'fas fa-pause';
          }).catch(error => {
            console.log("Autoplay blocked: ", error);
            // กรณีติดบล็อก ลองโหลดและเล่นซ้ำ
            audio.load();
            audio.play().then(() => {
              isPlaying = true;
              btnIcon.className = 'fas fa-pause';
            });
          });
        }
      }
    }

    // ผูกคำสั่งคลิกที่ปุ่มกลม
    mainPlayBtn.addEventListener('click', togglePlay);

    // เลือกสถานี
    stationSelect.addEventListener('change', function() {
      currentIndex = parseInt(this.value);
      title.textContent = playlist[currentIndex].name;
      audio.src = playlist[currentIndex].url;
      audio.load();
      audio.play().then(() => {
        isPlaying = true;
        btnIcon.className = 'fas fa-pause';
      }).catch(() => {
        isPlaying = false;
        btnIcon.className = 'fas fa-play';
      });
    });

    // ปรับความดัง
    volumeRange.addEventListener('input', function() {
      audio.volume = parseFloat(this.value);
    });

    // เพลงจบให้เล่นเพลงถัดไป
    audio.addEventListener('ended', function() {
      currentIndex = (currentIndex + 1) % playlist.length;
      stationSelect.value = currentIndex;
      title.textContent = playlist[currentIndex].name;
      audio.src = playlist[currentIndex].url;
      audio.load();
      audio.play();
    });
  </script>

</body>
</html>
