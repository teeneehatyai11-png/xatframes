<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit - Player Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      pointer-events: none;
    }

    body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    .interactive-box {
      pointer-events: auto !important;
    }

    /* เครื่องเล่นวิทยุซ้าย */
    .player-container {
      width: 260px;
      background: rgba(10, 20, 38, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 16px;
      padding: 18px 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 0 15px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      align-self: flex-start;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .disc-outer {
      width: 110px;
      height: 110px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      margin-bottom: 12px;
      border: 2px solid rgba(56, 189, 248, 0.3);
    }

    .disc-inner {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 4px solid #334155;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }

    .disc-center {
      width: 26px;
      height: 26px;
      background: #38bdf8;
      border-radius: 50%;
      border: 3px solid #0f172a;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .track-info {
      text-align: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .track-title {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-category {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 2px;
    }

    /* เครื่องเล่นเพลงมาตรฐานของเบราว์เซอร์ */
    audio {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      outline: none;
      margin-top: 5px;
    }

    /* กล่องเพลย์ลิสต์ขวา */
    .playlist-container {
      width: 260px;
      background: rgba(10, 20, 38, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 0 15px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .playlist-header {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    }

    .playlist-scroll {
      overflow-y: auto;
      flex: 1;
    }

    .playlist-item {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-item:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .playlist-item.active {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
    }

    .item-num {
      font-size: 11px;
      color: #38bdf8;
      font-weight: bold;
    }

    .item-title {
      color: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 9px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- เครื่องเล่นวิทยุฝั่งซ้าย -->
  <div class="player-container interactive-box">
    <div class="player-title">MYRADIOhit</div>
    
    <div class="disc-outer">
      <div class="disc-inner" id="disc">
        <div class="disc-center"></div>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">#1 สตริงใหม่ล่าสุด 2026</div>
      <div class="track-category" id="trackCategory">เพลงสตริงใหม่ล่าสุด</div>
    </div>

    <!-- HTML5 Audio Controller ตรงมาตรฐานผ่านระบบความปลอดภัยเบราว์เซอร์ -->
    <audio id="audioPlayer" controls controlsList="nodownload"></audio>
  </div>

  <!-- รายการเพลงฝั่งขวา -->
  <div class="playlist-container interactive-box">
    <div class="playlist-header">รายการเพลง (7 เพลง)</div>
    <div class="playlist-scroll" id="playlistItems"></div>
  </div>

  <script>
    // Proxy URL ป้องกัน CORS Block บน iFrame
    const corsProxy = "https://api.allorigins.win/raw?url=";

    const tracks = [
      {
        title: "#1 สตริงใหม่ล่าสุด 2026",
        category: "เพลงสตริงใหม่ล่าสุด",
        url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3"
      },
      {
        title: "#2 Thaistation Radio Mix",
        category: "เพลงสตริง",
        url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3"
      },
      {
        title: "#3 String Pop Selection",
        category: "สตริง 1",
        url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3"
      },
      {
        title: "#4 2-Hour Nonstop Hits",
        category: "สตริง 2 ชม.",
        url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3"
      },
      {
        title: "#5 Thai Country Favorites",
        category: "เพลงลูกทุ่ง",
        url: "https://ia600903.us.archive.org/29/items/luk-thung-music/Luk%20Thung%20music.mp3"
      },
      {
        title: "#6 Southern Hits New Coll...",
        category: "เพลงใต้ ชุดใหม่",
        url: "https://ia601609.us.archive.org/27/items/plangtai2/plangtai2.mp3"
      },
      {
        title: "#7 Southern Melodic Folk",
        category: "เพลงใต้ แนวเพราะ",
        url: "https://files.catbox.moe/k4dtxi.mp3"
      }
    ];

    let currentTrackIndex = 0;
    const audio = document.getElementById('audioPlayer');
    const disc = document.getElementById('disc');
    const trackTitle = document.getElementById('trackTitle');
    const trackCategory = document.getElementById('trackCategory');

    function renderPlaylist() {
      const container = document.getElementById('playlistItems');
      container.innerHTML = '';
      tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
        item.onclick = () => selectTrack(index);
        item.innerHTML = `
          <div class="item-num">${index + 1}</div>
          <div>
            <div class="item-title">${track.title}</div>
            <div class="item-sub">${track.category}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectTrack(index) {
      currentTrackIndex = index;
      trackTitle.innerText = tracks[index].title;
      trackCategory.innerText = tracks[index].category;
      renderPlaylist();

      // โหลด URL ผ่าน Proxy ป้องกันการบล็อก
      const rawUrl = tracks[index].url;
      audio.src = rawUrl.includes('archive.org') ? corsProxy + encodeURIComponent(rawUrl) : rawUrl;
      audio.play().catch(e => console.log("User action needed:", e));
    }

    audio.addEventListener('play', () => {
      disc.style.animationPlayState = 'running';
    });

    audio.addEventListener('pause', () => {
      disc.style.animationPlayState = 'paused';
    });

    audio.addEventListener('ended', () => {
      const nextIndex = (currentTrackIndex + 1) % tracks.length;
      selectTrack(nextIndex);
    });

    // เริ่มต้นหน้าเว็บ
    renderPlaylist();
    const initUrl = tracks[0].url;
    audio.src = initUrl.includes('archive.org') ? corsProxy + encodeURIComponent(initUrl) : initUrl;
  </script>
</body>
</html>
