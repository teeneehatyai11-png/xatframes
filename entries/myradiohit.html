
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', Arial, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      position: relative;
    }

    /* 🖼️ การ์ดฝั่งซ้าย (วิดีโอ yc18zg.mp4) */
    .left-card {
      position: absolute;
      top: 130px;
      left: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    /* 📱 การ์ดฝั่งขวา (วิดีโอ s9d6v6.mp4 + เครื่องเล่นวิทยุ) */
    .right-card {
      position: absolute;
      top: 130px;
      right: 15px;
      width: 300px;
      height: 480px;
      background: rgba(18, 18, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    /* วิดีโอวนลูปพื้นหลัง */
    .video-bg-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .video-bg-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: none;
    }

    /* ครอบเลเยอร์ส่วนควบคุมฝั่งขวา */
    .card-content-overlay {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(10, 15, 30, 0.9) 0%, rgba(10, 15, 30, 0.2) 50%, rgba(10, 15, 30, 0.8) 100%);
      margin: -12px;
      padding: 14px;
    }

    /* ส่วนหัวเปลี่ยนข้อความด้านบนเป็น LIVE ตามสั่ง */
    .radio-header {
      font-size: 15px;
      font-weight: 700;
      color: #ff0050;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 0, 80, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff0050;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0050;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* กล่องเครื่องเล่นวิทยุกระจก */
    .glass-player {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 10;
    }

    .song-info {
      text-align: center;
    }

    .now-playing {
      font-size: 9px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
      text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.5);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .playlist-select option {
      background: #12121c;
      color: #fff;
    }

    /* ปุ่มกดเล่นเพลง "กดเพื่อฟังวิทยุสด" */
    .play-btn-large {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #d91c5c 0%, #00c6ff 100%);
      border: none;
      border-radius: 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(217, 28, 92, 0.6);
      transition: all 0.2s ease;
    }

    .play-btn-large:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(0, 198, 255, 0.8);
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a0aec0;
      font-size: 11px;
    }

    .volume-box input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: #00f2fe;
      cursor: pointer;
    }

    /* 🚨 ปุ่มยักษ์ใสคลุมทั้งจอฝั่งขวา เพื่อแก้ปัญหา xat ไม่เล่นเพลง */
    #global-unlock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.01);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ตัวเล่นเพลงหลัก -->
  <audio id="audio-player" preload="auto"></audio>

  <!-- 🖼️ ฝั่งซ้าย (วิดีโอ yc18zg.mp4)[cite: 1] -->
  <div class="left-card">
    <div class="video-bg-box">
      <video autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- 📱 ฝั่งขวา (วิดีโอ s9d6v6.mp4)[cite: 1] -->
  <div class="right-card">
    <!-- Overlay แตะครั้งแรกปลดล็อกเสียงสำหรับ xat -->
    <div id="global-unlock-overlay" title="คลิกเพื่อเปิดระบบเสียง"></div>

    <div class="video-bg-box">
      <video autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card-content-overlay">
      <div class="radio-header">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>

      <div class="glass-player">
        <div class="song-info">
          <div class="now-playing">NOW PLAYING</div>
          <div class="track-title" id="current-title">รวมเพลงเพราะฟังสบาย</div>
        </div>

        <select class="playlist-select" id="station-select">
          <option value="0">1. รวมเพลงเพราะฟังสบาย</option>
          <option value="1">2. รวมเพลงเพราะฟังสบายตอนทำงาน</option>
          <option value="2">3. รวมเพลงเพราะฟังสบาย (สถานีที่ 3)</option>
          <option value="3">4. รวมเพลงเพราะวันพักผ่อน</option>
        </select>

        <div class="volume-box">
          <i class="fas fa-volume-up" id="vol-icon"></i>
          <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
        </div>

        <button class="play-btn-large" id="main-play-btn">
          <i class="fas fa-play" id="btn-icon"></i>
          <span id="btn-text">กดเพื่อฟังวิทยุสด</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const playlist = [
      { name: "รวมเพลงเพราะฟังสบาย", url: "https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3" },
      { name: "รวมเพลงเพราะฟังสบายตอนทำงาน", url: "https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3" },
      { name: "รวมเพลงเพราะฟังสบาย (สถานีที่ 3)", url: "https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3" },
      { name: "รวมเพลงเพราะวันพักผ่อน", url: "https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3" }
    ];

    const audio = document.getElementById('audio-player');
    const mainPlayBtn = document.getElementById('main-play-btn');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const title = document.getElementById('current-title');
    const stationSelect = document.getElementById('station-select');
    const volumeRange = document.getElementById('volume-range');
    const globalOverlay = document.getElementById('global-unlock-overlay');

    let currentIndex = 0;
    let isPlaying = false;

    // ตั้งค่าเบื้องต้น
    audio.src = playlist[0].url;
    audio.volume = 1.0;

    // ฟังก์ชันสั่งเล่นเสียงแบบบังคับ
    function forcePlay() {
      audio.play().then(() => {
        isPlaying = true;
        btnIcon.className = 'fas fa-pause';
        btnText.textContent = 'หยุดฟังวิทยุ';
        if (globalOverlay) globalOverlay.style.display = 'none';
      }).catch(err => {
        console.log("Playback error: ", err);
      });
    }

    function forcePause() {
      audio.pause();
      isPlaying = false;
      btnIcon.className = 'fas fa-play';
      btnText.textContent = 'กดเพื่อฟังวิทยุสด';
    }

    // เมื่อคลิกครั้งแรกที่การ์ดฝั่งขวา ให้ปลดล็อกระบบเสียงและเล่นทันที
    globalOverlay.addEventListener('click', () => {
      forcePlay();
    });

    // ปุ่มกดเปิด/ปิด
    mainPlayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isPlaying) {
        forcePause();
      } else {
        forcePlay();
      }
    });

    // เปลี่ยนสถานี
    stationSelect.addEventListener('change', (e) => {
      currentIndex = parseInt(e.target.value);
      title.textContent = playlist[currentIndex].name;
      audio.src = playlist[currentIndex].url;
      audio.load();
      forcePlay();
    });

    // ปรับระดับเสียง
    volumeRange.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    // เพลงจบให้เล่นเพลงถัดไปอัตโนมัติ
    audio.addEventListener('ended', () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      stationSelect.value = currentIndex;
      title.textContent = playlist[currentIndex].name;
      audio.src = playlist[currentIndex].url;
      audio.load();
      forcePlay();
    });
  </script>

</body>
</html>
