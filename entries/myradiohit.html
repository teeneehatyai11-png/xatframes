<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit - Full Video & Photo Player Frame</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      user-select: none;
    }

    /* พื้นหลังโปร่งใสและยกเลิก pointer-events ของ body เพื่อให้กดทะลุแชทตรงกลางได้ */
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }

    /* 📋 กล่องรายการเพลงฝั่งซ้าย */
    .playlist-container {
      position: absolute;
      top: 20px;
      left: 15px;
      width: 250px;
      height: calc(100vh - 40px);
      max-height: 540px;
      background: rgba(18, 18, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      z-index: 999999 !important;
      pointer-events: auto !important;
    }

    .playlist-header {
      font-size: 13px;
      font-weight: 700;
      color: #00f2fe;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-between;
    }

    .playlist-scroll {
      overflow-y: auto;
      flex: 1;
    }

    .playlist-item {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playlist-item:hover {
      background: rgba(0, 242, 254, 0.25);
    }

    .playlist-item.active {
      background: rgba(255, 0, 80, 0.35);
      border: 1px solid #ff0050;
    }

    .item-num { font-size: 11px; color: #00f2fe; font-weight: bold; }
    .item-title { color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 📱 กล่องเครื่องเล่นฝั่งขวาแบบแสดงผลภาพ/วิดีโอเต็มการ์ด */
    .player-card {
      position: absolute;
      top: 20px;
      right: 15px;
      width: 300px;
      height: calc(100vh - 40px);
      max-height: 540px;
      background: rgba(18, 18, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      z-index: 999999 !important;
      pointer-events: auto !important;
      overflow: hidden;
    }

    .tiktok-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .tiktok-channel {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    .tiktok-icon {
      width: 20px;
      height: 20px;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #fff;
      box-shadow: -2px -2px 6px #ff0050, 2px 2px 6px #00f2fe;
    }

    .live-tag {
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
    }

    .song-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .song-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
    }

    .song-info h2 {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .song-info p {
      font-size: 9px;
      color: #aaa;
    }

    /* 🎬 กรอบวิดีโอหลักปรับเต็มพื้นที่การ์ด (Full Container) */
    .media-container {
      flex: 1;
      width: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* ภาพสไลด์บนแบบคลุมเต็มพื้นที่ด้านบน */
    .photo-slide-box {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      background: #000;
    }

    .photo-slide-box img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* ปรับภาพให้เต็มกรอบเนียนสวย */
      transition: opacity 0.3s ease;
    }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 10px;
      text-align: center;
    }

    /* เครื่องเล่นวิดีโอ .mp4 เต็มส่วนล่าง */
    .video-box {
      flex: 1;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* ปรับวิดีโอให้เต็มพื้นที่ */
      outline: none;
    }
  </style>
</head>
<body>

  <!-- รายการเพลงซ้ายมือ -->
  <div class="playlist-container">
    <div class="playlist-header">
      <span>รายการเพลง</span>
      <span style="font-size:10px; color:#aaa;">7 รายการ</span>
    </div>
    <div class="playlist-scroll" id="playlist-items"></div>
  </div>

  <!-- เครื่องเล่นขวามือ (ภาพ + วิดีโอ แบบเต็มการ์ด) -->
  <div class="player-card">
    <div class="tiktok-badge">
      <div class="tiktok-channel">
        <div class="tiktok-icon"><i class="fa-brands fa-tiktok"></i></div>
        <span>Chill Music TH</span>
      </div>
      <div class="live-tag">LIVE</div>
    </div>

    <div class="song-header">
      <img src="https://xatimg.com/image/V6YjIf8rzCsg.png" alt="Logo" class="song-logo">
      <div class="song-info">
        <h2><span id="song-title">วิดีโอเพลงสตรีมมิ่ง</span></h2>
        <p>MYRADIOhit Online</p>
      </div>
    </div>

    <!-- ส่วนแสดงสื่อหลักแบบขยายเต็มกรอบการ์ด -->
    <div class="media-container">
      <!-- ภาพสไลด์เต็มกรอบ上 -->
      <div class="photo-slide-box">
        <img src="https://xatimg.com/image/P8z2aOMls66d.png" id="photo-viewer" alt="Slide Photo">
        <div class="photo-caption" id="photo-caption">✨ รวมเพลงเพราะจาก TIKTOK</div>
      </div>

      <!-- เล่นวิดีโอ .mp4 เต็มกรอบ下 -->
      <div class="video-box">
        <video id="main-video" controls preload="metadata" controlsList="nodownload">
          <source src="https://ia601406.us.archive.org/23/items/vedio_202610/vedio.mp4" type="video/mp4">
          เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      { image: "https://xatimg.com/image/P8z2aOMls66d.png", caption: "✨ รวมเพลงเพราะจาก TIKTOK" },
      { image: "https://xatimg.com/image/p5YKtEmIMo4X.png", caption: "🎧 ฟังเพลงชิลๆ ด้วยกัน" },
      { image: "https://xatimg.com/image/XVWLwqjqqstE.png", caption: "👫 มิตรภาพและความทรงจำ" },
      { image: "https://xatimg.com/image/A98tLWd84hNA.png", caption: "💫 ค่ำคืนนี้ยาวนาน" },
      { image: "https://xatimg.com/image/V4VgGwkfe6yV.png", caption: "🎵 เสียงเพลงบรรเลงต่อ..." },
      { image: "https://xatimg.com/image/0asGwujZ28p9.png", caption: "🌌 บรรยากาศยามค่ำคืน" }
    ];

    const tracksData = [
      { title: "#1 วิดีโอเพลงสตริงใหม่ล่าสุด" },
      { title: "#2 Thaistation Radio Mix" },
      { title: "#3 String Pop Selection" },
      { title: "#4 2-Hour Nonstop Hits" },
      { title: "#5 Thai Country Favorites" },
      { title: "#6 Southern Hits Collection" },
      { title: "#7 Southern Melodic Folk" }
    ];

    let currentSlideIndex = 0;
    const photoViewer = document.getElementById('photo-viewer');
    const photoCaption = document.getElementById('photo-caption');
    const songTitle = document.getElementById('song-title');

    // สลับสไลด์ภาพอัตโนมัติทุกๆ 4 วินาที
    setInterval(() => {
      currentSlideIndex = (currentSlideIndex + 1) % slides.length;
      photoViewer.style.opacity = '0.3';
      setTimeout(() => {
        photoViewer.src = slides[currentSlideIndex].image;
        photoCaption.innerText = slides[currentSlideIndex].caption;
        photoViewer.style.opacity = '1';
      }, 200);
    }, 4000);

    function renderPlaylist() {
      const container = document.getElementById('playlist-items');
      container.innerHTML = '';
      tracksData.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === 0 ? 'active' : ''}`;
        item.onclick = () => {
          songTitle.innerText = track.title;
          document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
        };
        item.innerHTML = `
          <div class="item-num">${index + 1}</div>
          <div class="item-title">${track.title}</div>
        `;
        container.appendChild(item);
      });
    }

    renderPlaylist();
  </script>
</body>
</html>
