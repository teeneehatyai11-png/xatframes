<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYRADIOhit & TikTok Player - Frame</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      user-select: none;
    }

    /* คลิกทะลุพื้นหลังไปยังห้องแชทตรงกลางได้ */
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      pointer-events: none;
    }

    body {
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      position: relative;
    }

    /* บังคับเปิดรับคลิกเฉพาะตัวกล่องวิทยุและรายการเพลง */
    .interactive-box {
      pointer-events: auto !important;
    }

    /* ภาพพื้นหลังเบลอเรืองแสง */
    .bg-blurred {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.4);
      transform: scale(1.1);
      transition: background-image 0.5s ease-in-out;
      z-index: 1;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 0, 80, 0.25), rgba(0, 242, 254, 0.2));
      z-index: 2;
    }

    /* 📋 รายการเพลงฝั่งซ้าย */
    .playlist-container {
      width: 260px;
      max-height: 85vh;
      background: rgba(18, 18, 28, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85),
                  0 0 15px rgba(0, 242, 254, 0.2);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .playlist-header {
      font-size: 14px;
      font-weight: 700;
      color: #00f2fe;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-scroll {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .playlist-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .playlist-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 242, 254, 0.4);
      border-radius: 4px;
    }

    .playlist-item {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .playlist-item:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: rgba(0, 242, 254, 0.3);
    }

    .playlist-item.active {
      background: rgba(255, 0, 80, 0.25);
      border-color: #ff0050;
      box-shadow: 0 0 10px rgba(255, 0, 80, 0.3);
    }

    .item-num {
      font-size: 11px;
      color: #00f2fe;
      font-weight: bold;
      min-width: 16px;
    }

    .item-info {
      overflow: hidden;
    }

    .item-title {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 10px;
      color: #aaa;
    }

    /* 📱 กล่องเครื่องเล่น TIKTOK ฝั่งขวา */
    .player-card {
      position: relative;
      z-index: 10;
      width: 280px;
      height: 85vh;
      max-height: 520px;
      background: rgba(18, 18, 28, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85),
                  0 0 20px rgba(255, 0, 80, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tiktok-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .tiktok-channel {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .tiktok-icon {
      width: 22px;
      height: 22px;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: -2px -2px 6px #ff0050, 2px 2px 6px #00f2fe;
      font-size: 11px;
    }

    .live-tag {
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 700;
    }

    .song-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .song-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .song-info h2 {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .song-info p {
      font-size: 10px;
      color: #aaa;
    }

    .photo-display-area {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0;
      border-radius: 12px;
      overflow: hidden;
      margin: 4px 0 8px 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      background: #000;
    }

    .photo-display-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s ease-in-out;
    }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 6px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: #fff;
      font-size: 11px;
      text-align: center;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 10px;
      border-radius: 12px;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: #aaa;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      accent-color: #ff0050;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .btn-control {
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-control:hover {
      color: #00f2fe;
      transform: scale(1.1);
    }

    .btn-play {
      width: 36px;
      height: 36px;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      box-shadow: 0 3px 10px rgba(255, 0, 80, 0.5);
    }
  </style>
</head>
<body>

  <!-- รายการเพลงฝั่งซ้าย -->
  <div class="playlist-container interactive-box">
    <div class="playlist-header">
      <span>รายการเพลง</span>
      <span style="font-size:10px; color:#aaa;">7 เพลง</span>
    </div>
    <div class="playlist-scroll" id="playlist-items"></div>
  </div>

  <!-- เครื่องเล่น TikTok ฝั่งขวา -->
  <div class="player-card interactive-box">
    <div class="bg-blurred" id="bg-blurred"></div>
    <div class="bg-overlay"></div>
    
    <div style="position: relative; z-index: 5; height: 100%; display: flex; flex-direction: column;">
      <div class="tiktok-badge">
        <div class="tiktok-channel">
          <div class="tiktok-icon"><i class="fa-brands fa-tiktok"></i></div>
          <span>Chill Music TH (@chillmusic.th)</span>
        </div>
        <div class="live-tag">LIVE</div>
      </div>

      <div class="song-header">
        <img src="https://xatimg.com/image/V6YjIf8rzCsg.png" alt="Logo" class="song-logo">
        <div class="song-info">
          <h2><span id="song-title">#1 สตริงใหม่ล่าสุด 2026</span></h2>
          <p id="artist-name">เพลงสตริงใหม่ล่าสุด</p>
        </div>
      </div>

      <div class="photo-display-area">
        <img src="" id="photo-viewer" alt="Music Photo Slide">
        <div class="photo-caption" id="photo-caption">Chill Music Mood</div>
      </div>

      <div class="controls">
        <div class="progress-bar-container">
          <span id="current-time">0:00</span>
          <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
          <span id="duration">0:00</span>
        </div>

        <div class="buttons">
          <button class="btn-control" id="prev-track" title="เพลงก่อนหน้า"><i class="fa-solid fa-backward-step"></i></button>
          <button class="btn-control btn-play" id="play-btn"><i class="fa-solid fa-play" id="play-icon"></i></button>
          <button class="btn-control" id="next-track" title="เพลงถัดไป"><i class="fa-solid fa-forward-step"></i></button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    const defaultSlides = [
      { time: 0.0, image: "https://xatimg.com/image/P8z2aOMls66d.png", caption: "✨ รวมเพลงเพราะจาก TIKTOK" },
      { time: 2.5, image: "https://xatimg.com/image/p5YKtEmIMo4X.png", caption: "🎧 ฟังเพลงชิลๆ ด้วยกัน" },
      { time: 5.0, image: "https://xatimg.com/image/XVWLwqjqqstE.png", caption: "👫 มิตรภาพและความทรงจำ" },
      { time: 7.5, image: "https://xatimg.com/image/A98tLWd84hNA.png", caption: "💫 ค่ำคืนนี้ยาวนาน" },
      { time: 10.0, image: "https://xatimg.com/image/V4VgGwkfe6yV.png", caption: "🎵 เสียงเพลงบรรเลงต่อ..." },
      { time: 12.5, image: "https://xatimg.com/image/0asGwujZ28p9.png", caption: "🌌 บรรยากาศยามค่ำคืน" }
    ];

    // ปรับเปลี่ยนระบบการดึง Streaming Direct Links
    const tracksData = [
      {
        title: "#1 สตริงใหม่ล่าสุด 2026",
        artist: "เพลงสตริงใหม่ล่าสุด",
        audioSrc: "https://ia800607.us.archive.org/28/items/sting-new/sting%20new.mp3",
        slides: defaultSlides
      },
      {
        title: "#2 Thaistation Radio Mix",
        artist: "เพลงสตริง",
        audioSrc: "https://ia802905.us.archive.org/5/items/thaistation/thaistation.mp3",
        slides: defaultSlides
      },
      {
        title: "#3 String Pop Selection",
        artist: "สตริง 1",
        audioSrc: "https://ia801906.us.archive.org/3/items/radio_202607/1.radio.mp3",
        slides: defaultSlides
      },
      {
        title: "#4 2-Hour Nonstop Hits",
        artist: "สตริง 2 ชม.",
        audioSrc: "https://ia801501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3",
        slides: defaultSlides
      },
      {
        title: "#5 Thai Country Favorites",
        artist: "เพลงลูกทุ่ง",
        audioSrc: "https://ia800903.us.archive.org/29/items/luk-thung-music/Luk%20Thung%20music.mp3",
        slides: defaultSlides
      },
      {
        title: "#6 Southern Hits New Coll...",
        artist: "เพลงใต้ ชุดใหม่",
        audioSrc: "https://ia801609.us.archive.org/27/items/plangtai2/plangtai2.mp3",
        slides: defaultSlides
      },
      {
        title: "#7 Southern Melodic Folk",
        artist: "เพลงใต้ แนวเพราะ",
        audioSrc: "https://files.catbox.moe/k4dtxi.mp3",
        slides: defaultSlides
      }
    ];

    let currentTrackIndex = 0;
    let currentSlideIndex = -1;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    
    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');
    const photoViewer = document.getElementById('photo-viewer');
    const photoCaption = document.getElementById('photo-caption');
    const bgBlurred = document.getElementById('bg-blurred');

    function renderPlaylist() {
      const container = document.getElementById('playlist-items');
      container.innerHTML = '';
      tracksData.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
        item.onclick = (e) => {
          e.stopPropagation();
          loadTrack(index);
          playAudio();
        };
        item.innerHTML = `
          <div class="item-num">${index + 1}</div>
          <div class="item-info">
            <div class="item-title">${track.title}</div>
            <div class="item-sub">${track.artist}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracksData[currentTrackIndex];

      songTitle.innerText = track.title;
      artistName.innerText = track.artist;
      audio.src = track.audioSrc;
      audio.load();

      currentSlideIndex = 0;
      updatePhoto(track.slides[0].image, track.slides[0].caption);
      renderPlaylist();
    }

    function updatePhoto(imgUrl, captionText) {
      photoViewer.style.opacity = '0';
      setTimeout(() => {
        photoViewer.src = imgUrl;
        photoCaption.innerText = captionText;
        bgBlurred.style.backgroundImage = `url('${imgUrl}')`;
        photoViewer.style.opacity = '1';
      }, 150);
    }

    function playAudio() {
      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          playIcon.className = 'fa-solid fa-pause';
        }).catch(err => {
          console.log("Error playing audio:", err);
          playIcon.className = 'fa-solid fa-play';
        });
      }
    }

    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      progress.value = (currentTime / audio.duration) * 100 || 0;
      currentTimeEl.innerText = formatTime(currentTime);

      const slides = tracksData[currentTrackIndex].slides;
      const cycleDuration = 15;
      const relativeTime = currentTime % cycleDuration;

      let activeIndex = 0;
      for (let i = 0; i < slides.length; i++) {
        if (relativeTime >= slides[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentSlideIndex) {
        currentSlideIndex = activeIndex;
        updatePhoto(slides[currentSlideIndex].image, slides[currentSlideIndex].caption);
      }
    });

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        playAudio();
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
      }
    });

    document.getElementById('next-track').addEventListener('click', (e) => {
      e.stopPropagation();
      currentTrackIndex = (currentTrackIndex + 1) % tracksData.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    document.getElementById('prev-track').addEventListener('click', (e) => {
      e.stopPropagation();
      currentTrackIndex = (currentTrackIndex - 1 + tracksData.length) % tracksData.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    progress.addEventListener('input', () => {
      audio.currentTime = (progress.value / 100) * audio.duration;
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracksData.length;
      loadTrack(currentTrackIndex);
      playAudio();
    });

    // เริ่มต้นเตรียมการ
    loadTrack(0);
  </script>
</body>
</html>
