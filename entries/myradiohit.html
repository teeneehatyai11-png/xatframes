<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: transparent;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* วิดีโอพื้นหลังใหม่ */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: 85% center;
            z-index: -999;
        }

        /* จัดตำแหน่งให้อยู่กึ่งกลางแนวตั้ง (กลางกล่องแชท) และอยู่ชิดซ้าย */
        .left-sidebar {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 260px;
            z-index: 2147483647;
        }

        /* เครื่องเล่นวิทยุ */
        .player-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 8px;
            padding: 10px 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }
        .player-top-bar {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .on-air-badge {
            background: #0ea5e9;
            color: #fff;
            font-size: 8px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .track-info-box {
            background: rgba(30, 41, 59, 0.8);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .now-playing-label {
            font-size: 8px;
            color: #38bdf8;
            font-weight: bold;
        }
        .track-name {
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .category-text {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 1px;
        }

        /* ปุ่มควบคุมและแถบเวลา */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .play-btn {
            width: 28px;
            height: 28px;
            background: #0ea5e9;
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .play-btn:hover {
            background: #0284c7;
        }
        .progress-bar-container {
            flex-grow: 1;
            background: #1e293b;
            height: 5px;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }
        .progress-fill {
            background: #38bdf8;
            height: 100%;
            width: 0%;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 6px;
        }
        .volume-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .volume-box input[type="range"] {
            width: 70px;
            accent-color: #0ea5e9;
        }

        /* รายชื่อเพลง Playlist */
        .playlist-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }
        .playlist-header {
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .playlist-item {
            padding: 6px 8px;
            margin-bottom: 4px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.3);
        }
        .playlist-item.active {
            background: rgba(14, 165, 233, 0.4);
            border: 1px solid #0ea5e9;
        }
        .playlist-item .title {
            font-size: 10px;
            color: #f8fafc;
            font-weight: bold;
        }
        .playlist-item .cat {
            font-size: 8px;
            color: #94a3b8;
        }

        .playlist-box::-webkit-scrollbar {
            width: 3px;
        }
        .playlist-box::-webkit-scrollbar-thumb {
            background: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- วิดีโอพื้นหลังใหม่ -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://files.catbox.moe/ebhsth.mp4" type="video/mp4">
    </video>
