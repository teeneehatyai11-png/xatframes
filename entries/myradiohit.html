<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }

        /* 🖼️ การ์ดฝั่งซ้าย (วิดีโอ yc18zg.mp4) */
        .left-card {
            position: absolute;
            top: 100px;
            left: 15px;
            width: 290px;
            height: 470px;
            background: rgba(18, 18, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
        }

        /* 📱 การ์ดฝั่งขวา (วิดีโอ s9d6v6.mp4 + วิทยุ) */
        .right-card {
            position: absolute;
            top: 100px;
            right: 15px;
            width: 290px;
            height: 470px;
            background: rgba(18, 18, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
        }

        /* วิดีโอพื้นหลัง */
        .video-bg-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        .video-bg-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* เลเยอร์ครอบส่วนควบคุม */
        .card-content-overlay {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(to top, rgba(10, 15, 30, 0.95) 0%, rgba(10, 15, 30, 0.2) 50%, rgba(10, 15, 30, 0.8) 100%);
            padding: 14px;
        }

        .radio-header {
            font-size: 14px;
            font-weight: 700;
            color: #ff0050;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(255, 0, 80, 0.8);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff0050;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0050;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* กล่องเครื่องเล่น Glassmorphism */
        .glass-player {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .song-info {
            text-align: center;
            width: 100%;
        }

        .now-playing {
            font-size: 9px;
            font-weight: 700;
            color: #00f2fe;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .track-title {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.5);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }

        .playlist-select option {
            background: #12121c;
            color: #fff;
        }

        /* 🔵 ปุ่มเปิด/ปิดวงกลมนีออน */
        .round-play-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #00f2fe);
            border: 2px solid rgba(255, 255, 255, 0.9);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            transition: transform 0.2s;
            margin: 2px 0;
        }

        .round-play-btn:active {
            transform: scale(0.92);
        }

        .round-play-btn i.fa-play {
            margin-left: 3px;
        }

        .volume-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a0aec0;
            font-size: 11px;
        }

        .volume-box input[type="range"] {
            flex: 1;
            height: 4px;
            accent-color: #00f2fe;
            cursor: pointer;
        }

        /* ซ่อน Audio แบบให้ยังทำงานได้ */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ใช้ HTML Audio Element เดิมที่คุณส่งมา -->
    <audio id="audio-player" preload="none"></audio>

    <!-- ฝั่งซ้าย (วิดีโอ yc18zg.mp4) -->
    <div class="left-card">
        <div class="video-bg-box">
            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- ฝั่งขวา (วิดีโอ s9d6v6.mp4 + วิทยุ) -->
    <div class="right-card">
        <div class="video-bg-box">
            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
            </video>
        </div>

        <div class="card-content-overlay">
            <div class="radio-header">
                <div class="live-dot"></div>
                <span>LIVE</span>
            </div>

            <div class="glass-player">
                <div class="song-info">
                    <div class="now-playing">NOW PLAYING</div>
                    <div class="track-title" id="current-title">1. รวมเพลงเพราะฟังสบาย</div>
                </div>

                <select class="playlist-select" id="station-select">
                    <option value="https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3">1. รวมเพลงเพราะฟังสบาย</option>
                    <option value="https://ia902905.us.archive.org/5/items/thaistation/thaistation.mp3">2. รวมเพลงเพราะฟังสบายตอนทำงาน</option>
                    <option value="https://ia601906.us.archive.org/3/items/radio_202607/1.radio.mp3">3. รวมเพลงเพราะฟังสบาย (สถานีที่ 3)</option>
                    <option value="https://ia601501.us.archive.org/2/items/thaistation-v.-1/thaistation%20v.1.mp3">4. รวมเพลงเพราะวันพักผ่อน</option>
                </select>

                <!-- 🔵 ปุ่มเปิด/ปิดทรงกลม -->
                <button class="round-play-btn" id="toggle-btn" onclick="togglePlayPause()">
                    <i class="fas fa-play" id="btn-icon"></i>
                </button>

                <div class="volume-box">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
                </div>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('audio-player');
        const btnIcon = document.getElementById('btn-icon');
        const stationSelect = document.getElementById('station-select');
        const titleElement = document.getElementById('current-title');

        // ฟังก์ชันสลับ เปิด / ปิด (Toggle Play & Pause)
        function togglePlayPause() {
            // ถ้ายังไม่มีเพลง ให้เอาเพลงแรกจาก select มาใส่
            if (!player.src || player.src === "" || player.src === window.location.href) {
                player.src = stationSelect.value;
            }

            // เช็กสถานะว่าเล่นอยู่หรือไม่
            if (player.paused) {
                player.play().then(() => {
                    btnIcon.className = "fas fa-pause"; // เปลี่ยนเป็นไอคอนหยุด
                }).catch(err => {
                    console.log("Play blocked: ", err);
                });
            } else {
                player.pause(); // สั่งหยุดเพลง
                btnIcon.className = "fas fa-play"; // เปลี่ยนกลับเป็นไอคอนเล่น
            }
        }

        // เปลี่ยนเพลงเมื่อเลือกจาก Dropdown
        stationSelect.addEventListener('change', function() {
            const selectedText = this.options[this.selectedIndex].text;
            titleElement.innerText = selectedText;
            player.src = this.value;
            
            // เล่นเพลงทันทีหลังเปลี่ยนสถานี
            player.play().then(() => {
                btnIcon.className = "fas fa-pause";
            });
        });

        // ปรับความดังเสียง
        function setVolume(val) {
            player.volume = val;
        }

        // เมื่อเพลงจบ ให้สลับไอคอนกลับเป็นปุ่ม Play
        player.onended = function() {
            btnIcon.className = "fas fa-play";
        };
    </script>
</body>
</html>
