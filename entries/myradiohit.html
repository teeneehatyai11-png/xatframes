<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit Mini Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }

        /* 🖼️ การ์ดฝั่งซ้าย (วิดีโอ yc18zg.mp4)[cite: 1, 3] */
        .left-card {
            position: absolute;
            top: 100px;
            left: 15px;
            width: 290px;
            height: 470px;
            background: rgba(18, 18, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
        }

        /* 📱 การ์ดฝั่งขวา (วิดีโอ s9d6v6.mp4 + เครื่องเล่นมินิ)[cite: 1, 3] */
        .right-card {
            position: absolute;
            top: 100px;
            right: 15px;
            width: 290px;
            height: 470px;
            background: rgba(18, 18, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
        }

        .video-bg-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        .video-bg-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content-overlay {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(to top, rgba(10, 15, 30, 0.95) 0%, rgba(10, 15, 30, 0.2) 50%, rgba(10, 15, 30, 0.8) 100%);
            padding: 14px;
        }

        .radio-header {
            font-size: 14px;
            font-weight: 700;
            color: #ff0050;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(255, 0, 80, 0.8);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff0050;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0050;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 🎧 กล่องเครื่องเล่นขนาดมินิ (Mini Glass Player) */
        .glass-player-mini {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 🔵 ปุ่มเปิด/ปิดวงกลมขนาดพอดีมือ */
        .round-play-btn {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #00f2fe);
            border: 2px solid rgba(255, 255, 255, 0.9);
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
            transition: transform 0.2s;
        }

        .round-play-btn:active {
            transform: scale(0.92);
        }

        .round-play-btn i.fa-play {
            margin-left: 2px;
        }

        .player-info-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .track-title {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00f2fe;
            font-size: 10px;
        }

        .volume-box input[type="range"] {
            flex: 1;
            height: 3px;
            accent-color: #00f2fe;
            cursor: pointer;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ไฟล์เพลงตัวเดิมที่เปิดดังชัวร์[cite: 3] -->
    <audio id="audio-player" src="https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3" preload="none"></audio>

    <!-- ฝั่งซ้าย (วิดีโอ yc18zg.mp4)[cite: 1, 3] -->
    <div class="left-card">
        <div class="video-bg-box">
            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- ฝั่งขวา (วิดีโอ s9d6v6.mp4 + วิทยุมินิ)[cite: 1, 3] -->
    <div class="right-card">
        <div class="video-bg-box">
            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
            </video>
        </div>

        <div class="card-content-overlay">
            <div class="radio-header">
                <div class="live-dot"></div>
                <span>LIVE</span>
            </div>

            <!-- เครื่องเล่นวิทยุไซส์มินิ กระทัดรัด -->
            <div class="glass-player-mini">
                <!-- ปุ่มกลมกด เปิด/ปิด[cite: 3] -->
                <button class="round-play-btn" id="toggle-btn" onclick="togglePlayPause()">
                    <i class="fas fa-play" id="btn-icon"></i>
                </button>

                <div class="player-info-box">
                    <div class="track-title">#1 Tag Hits String 2026</div>
                    <div class="volume-box">
                        <i class="fas fa-volume-up"></i>
                        <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('audio-player');
        const btnIcon = document.getElementById('btn-icon');

        // ฟังก์ชันสลับ เปิด / ปิด (Play / Pause)[cite: 3]
        function togglePlayPause() {
            if (player.paused) {
                player.play().then(() => {
                    btnIcon.className = "fas fa-pause"; // สลับเป็นไอคอนหยุด[cite: 3]
                }).catch(err => {
                    console.log("Play error: ", err);
                });
            } else {
                player.pause(); // สั่งหยุดเพลง[cite: 3]
                btnIcon.className = "fas fa-play"; // สลับกลับเป็นไอคอนเล่น[cite: 3]
            }
        }

        function setVolume(val) {
            player.volume = val;
        }

        player.onended = function() {
            btnIcon.className = "fas fa-play";
        };
    </script>
</body>
</html>
