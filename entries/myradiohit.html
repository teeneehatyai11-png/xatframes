<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit xatframe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fff;
        }
        .xatframe-wrapper {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 30px;
        }
        
        /* ด้านซ้าย: กล่องเปิดเครื่องเล่น */
        .player-card {
            width: 230px; background: rgba(10, 16, 26, 0.92); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 12px; padding: 20px 15px;
            display: flex; flex-direction: column; align-items: center; z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); text-align: center;
        }

        .radio-btn {
            display: block; width: 100%; padding: 12px 10px; margin-top: 10px;
            background: #00f0ff; color: #000; font-weight: bold; border-radius: 25px;
            text-decoration: none; box-shadow: 0 0 15px rgba(0,240,255,0.5);
            transition: all 0.2s; cursor: pointer; border: none; font-size: 13px;
        }
        .radio-btn:hover { background: #fff; transform: scale(1.03); }

        /* ตรงกลาง: เว้นว่างให้กรอบแชต xat */
        .chat-space { width: 650px; height: 486px; pointer-events: none; }

        /* ด้านขวา: ข้อมูลสถานี */
        .playlist-card {
            width: 230px; background: rgba(10, 16, 26, 0.92); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 15px; z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .info-item {
            padding: 8px; margin-top: 6px; background: rgba(255,255,255,0.05);
            border-radius: 6px; font-size: 12px; color: #ccc;
        }
    </style>
</head>
<body>

    <div class="xatframe-wrapper">
        <!-- ด้านซ้าย: ปุ่มกดเปิดวิทยุ -->
        <div class="player-card">
            <div style="font-size:12px; color:#00f0ff; font-weight:bold; margin-bottom:5px;">📻 MYRADIOHIT</div>
            <div style="font-size:11px; color:#aaa; margin-bottom:12px;">กดปุ่มด้านล่างเพื่อเริ่มฟังวิทยุออนไลน์</div>
            
            <a href="https://cerulean-meringue-3b052c.netlify.app" target="_blank" class="radio-btn">
                ▶ CLICK TO LISTEN (เปิดเครื่องเล่น)
            </a>
        </div>

        <!-- ตรงกลาง: เว้นว่างสำหรับแชต xat -->
        <div class="chat-space"></div>

        <!-- ด้านขวา: รายชื่อสถานี -->
        <div class="playlist-card">
            <div style="font-size:13px; font-weight:bold; color:#00f0ff; margin-bottom:8px;">📋 Available Channels</div>
            <div class="info-item">#1 สตริงใหม่ล่าสุด</div>
            <div class="info-item">#2 เพลตริง (Thaistation)</div>
            <div class="info-item">#3 สตริง 1 Selection</div>
            <div class="info-item">#4 สตริง 2 ชม (Nonstop)</div>
        </div>
    </div>

</body>
</html>
