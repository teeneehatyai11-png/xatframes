<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: transparent;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
        }

        /* จัดโครงสร้างคอลัมน์ซ้าย-ขวา ขยับลงมา 90px */
        .column {
            transform: translateY(90px);
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 🎬 1. ส่วนภาพ/วิดีโอ ปรับความสูงเป็น 486px ตามที่ต้องการ */
        .box-media {
            width: 100%;
            height: 486px; /* ปรับสูง 486px */
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .box-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /* 📻 2. ส่วนวิทยุ/Playlist ขนาดเล็กต่อท้ายด้านล่าง (ไม่ทับซ้อนภาพ) */
        .box-sub {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* วิทยุด้านซ้าย */
        .player-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .vinyl-box {
            width: 36px;
            height: 36px;
            background: #000;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #1e293b;
        }
        .vinyl-center {
            width: 12px;
            height: 12px;
            background: #0ea5e9;
            border-radius: 50%;
        }
        .player-info {
            overflow: hidden;
        }
        .player-header {
            font-size: 10px;
            color: #94a3b8;
        }
        .track-title {
            font-size: 11px;
            font-weight: bold;
            color: #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        audio {
            width: 100%;
            height: 28px;
        }

        /* Playlist ด้านขวา */
        .playlist-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .playlist-item {
            padding: 6px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 11px;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.3);
        }
        .playlist-item .cat {
            font-size: 9px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- 👈 ฝั่งซ้าย: วิดีโอสูง 486px + วิทยุเล็กๆ ต่อท้ายด้านล่าง -->
    <div class="column">
        <div class="box-media">
            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/yc18zg.mp4" type="video/mp4">
            </video>
        </div>

        <div class="box-sub">
            <div class="player-top">
                <div class="vinyl-box">
                    <div class="vinyl-center"></div>
                </div>
                <div class="player-info">
                    <div class="player-header">Myradiohit Player</div>
                    <div class="track-title" id="current-title">Select a track</div>
                </div>
            </div>
            <audio id="audio-player" controls></audio>
        </div>
    </div>

    <!-- 👉 ฝั่งขวา: วิดีโอสูง 486px + Playlist เล็กๆ ต่อท้ายด้านล่าง -->
    <div class="column">
        <div class="box-media">
            <video autoplay loop muted playsinline>
                <source src="https://files.catbox.moe/s9d6v6.mp4" type="video/mp4">
            </video>
        </div>

        <div class="box-sub">
            <div class="playlist-title">Playlist</div>
            <div class="playlist-item" onclick="playTrack('สตริงใหม่ล่าสุด', 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3')">
                <div>#1 Tag Hits String 2026</div>
                <div class="cat">Category: String</div>
            </div>
        </div>
    </div>

    <script>
        function playTrack(title, url) {
            const player = document.getElementById('audio-player');
            const titleElement = document.getElementById('current-title');
            
            titleElement.innerText = title;
            player.src = url;
            player.play();
        }
    </script>
</body>
</html>
