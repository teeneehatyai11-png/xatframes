
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MYRADIOhit Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: transparent;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            padding-top: 90px; /* ดันทุกอย่างลงมาจากด้านบน 90px โดยไม่ดันขอบกล่องหลุดจอ */
            height: 100vh;
            overflow: hidden;
        }
        /* เครื่องเล่นวิทยุด้านซ้าย */
        .player-container {
            width: 280px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .player-header {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .vinyl-box {
            width: 120px;
            height: 120px;
            background: #000;
            border-radius: 50%;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #1e293b;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .vinyl-center {
            width: 40px;
            height: 40px;
            background: #0ea5e9;
            border-radius: 50%;
        }
        .now-playing {
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .track-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        audio {
            width: 100%;
            height: 35px;
        }

        /* Playlist ด้านขวา */
        .playlist-container {
            width: 280px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-height: 70vh;
            overflow-y: auto;
        }
        .playlist-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .playlist-item {
            padding: 8px;
            margin-bottom: 6px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }
        .playlist-item:hover {
            background: rgba(56, 189, 248, 0.3);
        }
        .playlist-item .cat {
            font-size: 10px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- ส่วนเครื่องเล่นเพลง (ซ้าย) -->
    <div class="player-container">
        <div class="player-header">Myradiohit Radio Player</div>
        <div class="vinyl-box">
            <div class="vinyl-center"></div>
        </div>
        <div class="now-playing">NOW PLAYING</div>
        <div class="track-title" id="current-title">Select a track to start</div>
        <audio id="audio-player" controls></audio>
    </div>

    <!-- ส่วนรายการเพลง Playlist (ขวา) -->
    <div class="playlist-container">
        <div class="playlist-title">Playlist</div>
        
        <div class="playlist-item" onclick="playTrack('สตริงใหม่ล่าสุด', 'https://ia600607.us.archive.org/28/items/sting-new/sting%20new.mp3')">
            <div>#1 Tag Hits String 2026</div>
            <div class="cat">Category: String</div>
        </div>
    </div>

    <script>
        function playTrack(title, url) {
            const player = document.getElementById('audio-player');
            const titleElement = document.getElementById('current-title');
            
            titleElement.innerText = title;
            player.src = url;
            player.play();
        }
    </script>
</body>
</html>
