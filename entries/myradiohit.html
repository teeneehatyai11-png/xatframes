<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRADIOhit xatframe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fff;
        }
        .xatframe-wrapper {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 30px;
        }
        
        /* ด้านซ้าย: ฝังเครื่องเล่นวิทยุ Plathong */
        .player-card {
            width: 250px; background: rgba(10, 16, 26, 0.92); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; align-items: center; z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); pointer-events: auto;
        }

        .radio-iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 8px;
            overflow: hidden;
        }

        /* ตรงกลาง: เว้นว่างให้กรอบแชต xat วางซ้อน */
        .chat-space {
            width: 650px;
            height: 486px;
            pointer-events: none;
        }

        /* ด้านขวา: เพลย์ลิสต์/ข้อมูลสถานี */
        .playlist-card {
            width: 230px; background: rgba(10, 16, 26, 0.92); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 15px; z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); pointer-events: auto;
        }
        .info-item {
            padding: 8px; margin-top: 6px; background: rgba(255,255,255,0.05);
            border-radius: 6px; font-size: 12px; color: #00f0ff; text-align: center;
        }
    </style>
</head>
<body>

    <div class="xatframe-wrapper">
        <!-- ด้านซ้าย: เครื่องเล่นวิทยุ Plathong -->
        <div class="player-card">
            <div style="font-size:12px; color:#00f0ff; font-weight:bold; margin-bottom:8px;">📻 MYRADIOHIT STREAM</div>
            <iframe src="https://radio.plathong.net/main/player/?server=radio14&port=7056" class="radio-iframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- ตรงกลาง: เว้นว่างไว้สำหรับแชต xat -->
        <div class="chat-space"></div>

        <!-- ด้านขวา: ข้อมูลสถานี -->
        <div class="playlist-card">
            <div style="font-size:13px; font-weight:bold; color:#00f0ff; margin-bottom:8px;">📋 Station Info</div>
            <div class="info-item">🟢 LIVE STREAMING</div>
            <div class="info-item">Server: radio14</div>
            <div class="info-item">Port: 7056</div>
        </div>
    </div>

</body>
</html>
